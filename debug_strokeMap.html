<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>筆順圖檢查工具</title>
  <style>
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .char-input {
      font-size: 2rem;
      padding: 10px;
      margin: 10px 0;
      width: 200px;
      text-align: center;
    }
    .result {
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      background: #f5f5f5;
    }
    .success {
      background: #d4edda;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 5px;
      cursor: pointer;
    }
    #char-list {
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    .char-item {
      display: inline-block;
      margin: 5px;
      padding: 5px 10px;
      border-radius: 5px;
      background: #e9ecef;
    }
    .char-item.has-stroke {
      background: #d4edda;
    }
    .char-item.no-stroke {
      background: #f8d7da;
    }
  </style>
  <script src="strokeMap.js"></script>
</head>
<body>
  <h1>🔍 筆順圖檢查工具</h1>
  
  <div>
    <label>輸入要檢查的字：</label><br>
    <input type="text" id="char-input" class="char-input" placeholder="例如：井" maxlength="1">
    <button onclick="checkChar()">檢查</button>
    <button onclick="checkAll()">檢查所有字</button>
    <button onclick="clearResults()">清除結果</button>
  </div>
  
  <div id="result"></div>
  <div id="char-list"></div>

  <script>
    function checkChar() {
      const input = document.getElementById('char-input');
      const char = input.value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!char) {
        resultDiv.innerHTML = '<div class="result error">請輸入一個字</div>';
        return;
      }
      
      const hasStroke = strokeMap.hasOwnProperty(char);
      const url = strokeMap[char] || '無';
      
      let html = '<div class="result ' + (hasStroke ? 'success' : 'error') + '">';
      html += `<h3>檢查結果：${char}</h3>`;
      html += `<p><strong>在 strokeMap 中：</strong> ${hasStroke ? '✓ 是' : '✗ 否'}</p>`;
      if (hasStroke) {
        html += `<p><strong>筆順圖網址：</strong><br><a href="${url}" target="_blank">${url}</a></p>`;
        html += `<p><strong>測試載入：</strong></p>`;
        html += `<img src="${url}" alt="筆順圖" style="max-width: 200px; border: 1px solid #ccc;" onerror="this.style.border='2px solid red'; this.alt='載入失敗'">`;
      } else {
        html += '<p>這個字沒有在 strokeMap.js 中</p>';
      }
      html += '</div>';
      
      resultDiv.innerHTML = html;
    }
    
    function checkAll() {
      const resultDiv = document.getElementById('result');
      const listDiv = document.getElementById('char-list');
      
      // 測試一些常見的字
      const testChars = '一二三四五六七八九十上下大小人口手目耳鼻舌牙心水火木土金日月星天地人父母子女兄弟姐妹朋友';
      
      let hasStrokeCount = 0;
      let noStrokeCount = 0;
      let html = '';
      
      for (const char of testChars) {
        const hasStroke = strokeMap.hasOwnProperty(char);
        if (hasStroke) {
          hasStrokeCount++;
          html += `<span class="char-item has-stroke" title="${strokeMap[char]}">${char}</span>`;
        } else {
          noStrokeCount++;
          html += `<span class="char-item no-stroke">${char}</span>`;
        }
      }
      
      resultDiv.innerHTML = `
        <div class="result info">
          <h3>檢查結果</h3>
          <p>總字數：${testChars.length}</p>
          <p>有筆順圖：${hasStrokeCount} 個</p>
          <p>沒有筆順圖：${noStrokeCount} 個</p>
          <p>strokeMap 總字數：${Object.keys(strokeMap).length}</p>
        </div>
      `;
      
      listDiv.innerHTML = '<h3>字列表：</h3>' + html;
    }
    
    function clearResults() {
      document.getElementById('result').innerHTML = '';
      document.getElementById('char-list').innerHTML = '';
    }
    
    // 檢查 strokeMap 是否載入
    window.addEventListener('load', () => {
      const resultDiv = document.getElementById('result');
      if (typeof strokeMap === 'undefined') {
        resultDiv.innerHTML = '<div class="result error">❌ strokeMap.js 沒有正確載入！</div>';
      } else {
        resultDiv.innerHTML = `<div class="result success">✅ strokeMap.js 已載入，共有 ${Object.keys(strokeMap).length} 個字</div>`;
      }
    });
    
    // 按 Enter 鍵檢查
    document.getElementById('char-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkChar();
      }
    });
  </script>
</body>
</html>
